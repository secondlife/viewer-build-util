name: sign-pkg-mac
description:
  Sign and package the macOS Linden viewer.

inputs:
  imagename:
    description: "Basename of installer .dmg"
    type: string
    required: true
  channel:
    description: "Viewer channel"
    type: string
    required: true
  cert_base64:
    description: "base64-encoded signing certificate"
    type: string
    required: true
  cert_name:
    description: "full name of signing certificate"
    type: string
    required: true
  cert_pass:
    description: "signing certificate password"
    type: string
    required: true
  note_user:
    description: "notarization Apple ID"
    type: string
    required: true
  note_pass:
    description: "password for note_user"
    type: string
    required: true
  note_team:
    description: "Team ID for note_user"
    type: string
    required: true
  channel_vendor_base:
    description: "setting for all steps"
    type: string
    required: false
    default: "Second Life"
  velopack_pack_id:
    description: "Velopack pack ID (from build step)"
    required: false
  velopack_pack_version:
    description: "Velopack pack version (from build step)"
    required: false
  velopack_pack_title:
    description: "Velopack pack title (from build step)"
    required: false
  velopack_main_exe:
    description: "Velopack main executable name (from build step)"
    required: false
  velopack_bundle_id:
    description: "Velopack bundle ID (from build step)"
    required: false

runs:
  using: composite
  steps:
    - name: Fetch Mac app
      uses: actions/download-artifact@v4
      with:
        name: macOS-app
        path: .tarball

    - name: Unpack the tarball
      id: unpack
      shell: bash
      run: |
        set -x
        mkdir -p ".app"
        tar xJf .tarball/* -C ".app"

    # Velopack packaging — run BEFORE signing so that UpdateMac and sq.version
    # are injected into the app bundle. sign.sh then signs everything including
    # the Velopack updater binaries.
    - name: Setup Velopack CLI
      if: ${{ inputs.velopack_pack_id }}
      uses: secondlife/viewer-build-util/setup-velopack@geenz/velopack

    - name: Build Velopack package
      if: ${{ inputs.velopack_pack_id }}
      shell: bash
      env:
        PACK_ID: ${{ inputs.velopack_pack_id }}
        PACK_VERSION: ${{ inputs.velopack_pack_version }}
        PACK_TITLE: ${{ inputs.velopack_pack_title }}
        MAIN_EXE: ${{ inputs.velopack_main_exe }}
        BUNDLE_ID: ${{ inputs.velopack_bundle_id }}
      run: |
        set -x
        # The app bundle from the build step
        app_bundle="$(ls -dt .app/*.app | head -n 1)"

        # Run vpk pack — unsigned. This injects UpdateMac and sq.version
        # into the bundle, then produces the nupkg and Portable.zip.
        # Signing and notarization are handled by sign.sh afterward.
        vpk pack \
          --packId "$PACK_ID" \
          --packVersion "$PACK_VERSION" \
          --packDir "$app_bundle" \
          --packTitle "$PACK_TITLE" \
          --mainExe "$MAIN_EXE" \
          --bundleId "$BUNDLE_ID" \
          --outputDir Releases \
          --noInst \
          --verbose

    - name: Replace app bundle with Velopack-ready version
      if: ${{ inputs.velopack_pack_id }}
      shell: bash
      env:
        PACK_ID: ${{ inputs.velopack_pack_id }}
        PACK_TITLE: ${{ inputs.velopack_pack_title }}
      run: |
        set -x
        # The Portable.zip contains the app bundle with UpdateMac and sq.version
        # already injected by vpk pack. Extract it and use it for the DMG.
        portable_zip="$(ls Releases/*-Portable.zip | head -n 1)"
        if [[ -z "$portable_zip" ]]; then
          echo "::error::No Portable.zip found in Releases/"
          exit 1
        fi

        # Remove the original app bundle and extract the Velopack-ready one
        rm -rf .app/*.app
        # ditto preserves macOS metadata, resource forks, and symlinks
        ditto -xk "$portable_zip" .app/

        # Verify we got an app bundle
        new_app="$(ls -dt .app/*.app | head -n 1)"
        if [[ -z "$new_app" ]]; then
          echo "::error::No .app bundle found after extracting Portable.zip"
          exit 1
        fi

        echo "Using Velopack-ready app bundle: $new_app"
        # Verify UpdateMac is present
        if [[ -f "$new_app/Contents/MacOS/UpdateMac" ]]; then
          echo "UpdateMac binary present"
        else
          echo "::warning::UpdateMac binary not found in extracted bundle"
        fi

    - name: Sign and notarize the app
      shell: bash
      env:
        cert_base64: "${{ inputs.cert_base64 }}"
        cert_name: "${{ inputs.cert_name }}"
        cert_pass: "${{ inputs.cert_pass }}"
        note_user: "${{ inputs.note_user }}"
        note_pass: "${{ inputs.note_pass }}"
        note_team: "${{ inputs.note_team }}"
      run: |
        # Sign the Velopack-ready app bundle (which includes UpdateMac).
        app_bundle="$(ls -dt .app/*.app | head -n 1)"
        "${{ github.action_path }}/sign.sh" "$app_bundle"

    - name: Repackage signed Portable.zip
      if: ${{ inputs.velopack_pack_id }}
      shell: bash
      run: |
        set -x -e
        portable_zip="$(ls Releases/*-Portable.zip | head -n 1)"
        if [[ -n "$portable_zip" ]]; then
          # Replace the unsigned Portable.zip with the signed bundle
          rm "$portable_zip"
          app_bundle="$(ls -dt .app/*.app | head -n 1)"
          ditto -c -k --keepParent "$app_bundle" "$portable_zip"
          echo "Repackaged signed bundle into $portable_zip"
        fi

    - name: Set up the app sparseimage
      shell: bash
      run: |
        set -x -e
        # MBW -- If the mounted volume name changes, it breaks the .DS_Store's
        #  background image and icon positioning. If we really need
        #  differently named volumes, we'll need to create multiple DS_Store
        #  file images, or use some other trick.
        # DO NOT CHANGE without understanding comment above
        volname="${{ inputs.channel_vendor_base }} Installer"
        sparsename="${{ inputs.imagename}}.sparseimage"
        rm "$sparsename" || true
        echo "sparsename=$sparsename" >> "$GITHUB_ENV"

        # The capacity of the .sparseimage, which sometimes needs to be
        # changed, is hard-coded here instead of defined as an input because
        # changing it here allows us to rerun just this job. Changing it in
        # the viewer's build.yaml would require first rebuilding the viewer.
        hdiutil create "$sparsename" -volname "$volname" -fs HFS+ \
                -type SPARSE -megabytes 2000 -layout SPUD

        # mount the image and get the name of the mount point and device node
        hdi_output="$(hdiutil attach -private "$sparsename")"

        # with set -e in effect, test has the force of an assert
        [[ "$hdi_output" =~ (/dev/disk[0-9]+)[^s] ]]
        devfile="${BASH_REMATCH[1]}"
        echo "devfile=$devfile" >> "$GITHUB_ENV"
        [[ "$hdi_output" =~ HFS[[:space:]]+(.+) ]]
        volpath="${BASH_REMATCH[1]}"

        # copy everything to the mounted sparseimage

        # What follows is oddly based on a predefined .DS_Store file, which
        # apparently used to be one of several -- despite the presence of
        # dmg-cleanup.applescript since at least 2009. Leaving legacy behavior
        # for now, albeit with files transplanted from the viewer repo.
        dmg_prefill="${{ github.action_path }}/installer/release-dmg"
        for f in _VolumeIcon.icns _DS_Store background.jpg
        do
            dest="$volpath/${f/_/.}"
            cp -v "$dmg_prefill/$f" "$dest"
            # hide the files used only to control the Finder display
            SetFile -a V "$dest"
        done

        # don't forget the application itself
        artifact_app="$(ls -dt .app/*.app | head -n 1)"
        cp -a "$artifact_app" "$volpath/"
        app_name="$(basename "$artifact_app")"
        echo "app_path=$volpath/$app_name" >> "$GITHUB_ENV"

        # Create the alias file (which is a resource file) from the .r
        Rez "$dmg_prefill/Applications-alias.r" -o "$volpath/Applications"

        # Set the alias file's alias bit
        SetFile -a A "$volpath/Applications"

        # Set the disk image root's custom icon bit
        SetFile -a C "$volpath"

    - name: Unmount the sparseimage
      # unmount even if the above fails
      if: ${{ ! cancelled() }}
      shell: bash
      run: |
        # Empirically, on GitHub we've hit errors like:
        # hdiutil: couldn't eject "disk10" - Resource busy
        retries=3
        retry_wait=2
        for (( attempt=0; attempt < $retries; attempt+=1 ))
        do
            if [[ $attempt -gt 0 ]]
            then
                echo "detach $attempt failed, waiting $retry_wait seconds before retrying" >&2
                sleep $retry_wait
                (( retry_wait*=2 ))
            fi
            hdiutil detach -force ${{ env.devfile }} && break
        done
        if [[ $? -ne 0 ]]
        then echo "::warning::$retries attempts to detach ${{ env.devfile }} failed"
        fi

    - name: Package the sparseimage as .dmg
      shell: bash
      run: |
        set -x
        mkdir -p .installer
        installer=".installer/${{ inputs.imagename }}.dmg"
        rm "$installer" || true
        # pass installer to next step
        echo "installer=$installer" >> "$GITHUB_ENV"

        hdiutil convert "${{ env.sparsename }}" -format UDZO -imagekey zlib-level=9 \
                -o "$installer"
        rm "${{ env.sparsename }}"

    - name: Post the installer
      uses: actions/upload-artifact@v4
      with:
        name: "macOS-installer"
        path: ${{ env.installer }}

    - name: Upload Velopack releases
      if: ${{ inputs.velopack_pack_id }}
      uses: actions/upload-artifact@v4
      with:
        name: "macOS-releases"
        path: Releases/
